    <main>
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        <form action="./contacto.html" method="post">
            <label for="id_nombre">Nobre</label>
            <input type="text" name="Nombre" id="id_nombre" placeholder="Ej:Jose">
            <label for="id_email">Email</label>
            <input type="email" name="email" id="id_email" placeholder="Ej:josetelapusoysefue@gmail.com">

            <label for="id_tipo">Tipo mascota</label>
            <select name="tipo" id="id_tipo">
                <option value="perro">Perro</option>
                 <option value="ballena">Ballena</option>
                  <option value="loro">Loro</option>
            </select>


            <label for="id_comentario">Comentario</label>
            <textarea name="comentario" id="id_comentario"></textarea>


            <button type="submit">Enviar</button>
         
        </form>
        <h2>Donde Estamos</h2>
