<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas - Catalogo</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <img src="./recursos/imagenes/mascota.png" alt="logo de Huellitas">
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <h1>Catalogo de Huellitas</h1>
        <section>
            <h2>Productos</h2>
            <div>
                <article class="tarjeta-producto">
                    <h3>Correa de cuero</h3>
                    <picture>
                       <img id="producto" src="./recursos/imagenes/productos/correa_perro.webp" alt="correa para perro">
                    </picture>
                    <p>Correa de cuero extensible, de material reciclado</p>
                    <ul>
                        <li>Talles: l, xl, m</li>
                        <li>Precio: 10000$</li>
                    </ul>
                    <button>añadir al carro de compras</button>
                </article>
            </div>

            <div>
                <article class="tarjeta-producto">
                    <h3>Juguete</h3>
                    <picture>
                        <img src="./recursos/imagenes/productos/juguete.webp" alt="juguete de plastico">
                    </picture>
                    <p>Jueguete de plastico de pato para que se diviertan</p>
                    <ul>
                        <li>Precio: 2000$</li>
                    </ul>
                    <button>añadir al carro de compras</button>
                </article>
            </div>
        </section>
        
    </main>
    <footer>
        <p>&copy; 2026 Huellitas. Todos los derechos reservados.</p>
        
    </footer>
</body>
</html>
